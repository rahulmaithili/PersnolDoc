<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DocVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4361ee, #1e2139);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .reset-card, .error-card {
            width: 100%;
            max-width: 420px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #fff;
            padding: 2.5rem 2rem;
            margin: 1rem;
        }
        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 5px;
            display: flex;
            gap: 4px;
        }
        .strength-segment {
            flex: 1;
            background-color: #e9ecef;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="reset-card text-center d-none" id="formCard">
        <div class="mb-4 text-primary">
            <i class="fa-solid fa-lock fa-4x" style="color: #4361ee;"></i>
        </div>
        <h2 class="mb-1 fw-bold">Reset Password</h2>
        <p class="text-muted mb-4">Enter your new password below</p>
        <form id="resetForm">
            <div class="mb-3 text-start">
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-key"></i></span>
                    <input type="password" class="form-control" id="newPassword" placeholder="New Password" required minlength="8">
                    <button class="btn btn-outline-secondary toggle-pw" type="button" data-target="newPassword"><i class="fa-solid fa-eye"></i></button>
                </div>
                <div class="strength-bar" id="strengthBar">
                    <div class="strength-segment"></div>
                    <div class="strength-segment"></div>
                    <div class="strength-segment"></div>
                    <div class="strength-segment"></div>
                </div>
            </div>
            <div class="input-group mb-4">
                <span class="input-group-text bg-light"><i class="fa-solid fa-check"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password" required minlength="8">
                <button class="btn btn-outline-secondary toggle-pw" type="button" data-target="confirmPassword"><i class="fa-solid fa-eye"></i></button>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3 py-2" id="submitBtn" style="background-color: #4361ee; border-color: #4361ee; border-radius: 8px;">
                <span class="spinner-border spinner-border-sm d-none me-2" id="submitSpinner" role="status"></span>Reset Password
            </button>
        </form>
    </div>

    <div class="error-card text-center d-none" id="errorCard">
        <div class="mb-4 text-danger">
            <i class="fa-solid fa-circle-xmark fa-4x"></i>
        </div>
        <h2 class="mb-3 fw-bold">Invalid Link</h2>
        <p class="text-muted mb-4">This password reset link is invalid or has expired.</p>
        <a href="forgot-password.html" class="btn btn-primary w-100 py-2" style="background-color: #4361ee; border-color: #4361ee; border-radius: 8px;">Request New Link</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        let token = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initTheme === 'function') initTheme();
            
            const urlParams = new URLSearchParams(window.location.search);
            token = urlParams.get('token');
            
            if (!token) {
                document.getElementById('errorCard').classList.remove('d-none');
            } else {
                document.getElementById('formCard').classList.remove('d-none');
            }
        });

        // Toggle password visibility
        document.querySelectorAll('.toggle-pw').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const input = document.getElementById(targetId);
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text'; icon.className = 'fa-solid fa-eye-slash';
                } else {
                    input.type = 'password'; icon.className = 'fa-solid fa-eye';
                }
            });
        });

        // Simple password strength
        document.getElementById('newPassword').addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length > 7) score++;
            if (val.match(/[A-Z]/)) score++;
            if (val.match(/[0-9]/)) score++;
            if (val.match(/[^a-zA-Z0-9]/)) score++;
            
            const segments = document.querySelectorAll('.strength-segment');
            segments.forEach((seg, i) => {
                seg.style.backgroundColor = '#e9ecef';
                if (i < score) {
                    if (score === 1) seg.style.backgroundColor = '#dc3545';
                    else if (score === 2) seg.style.backgroundColor = '#ffc107';
                    else if (score === 3) seg.style.backgroundColor = '#17a2b8';
                    else seg.style.backgroundColor = '#28a745';
                }
            });
        });

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('submitSpinner');
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (newPassword !== confirmPassword) {
                Swal.fire({icon: 'error', title: 'Oops...', text: 'Passwords do not match'});
                return;
            }
            
            btn.disabled = true;
            spinner.classList.remove('d-none');
            
            try {
                if (typeof resetPassword === 'function') {
                    const success = await resetPassword(token, newPassword, confirmPassword);
                    if (success !== false) {
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 2000);
                    }
                }
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
