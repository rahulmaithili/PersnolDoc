<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - DocVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
    <style>
        :root {
            --login-bg: #090c15;
            --login-card-bg: rgba(18, 22, 38, 0.85);
            --login-card-border: rgba(255, 255, 255, 0.08);
            --login-text: #f1f5f9;
            --login-muted: #94a3b8;
            --login-input-bg: rgba(255, 255, 255, 0.04);
            --login-input-border: rgba(255, 255, 255, 0.12);
        }

        [data-theme="light"] {
            --login-bg: #f0f4f9;
            --login-card-bg: rgba(255, 255, 255, 0.94);
            --login-card-border: rgba(0, 0, 0, 0.08);
            --login-text: #1e293b;
            --login-muted: #64748b;
            --login-input-bg: #f8fafc;
            --login-input-border: #cbd5e1;
        }

        body.auth-body {
            background-color: var(--login-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            position: relative;
            overflow-x: hidden;
            margin: 0;
            padding: 20px;
            transition: background-color 0.3s ease;
        }

        .ambient-glow-1 {
            position: fixed;
            width: 480px;
            height: 480px;
            top: -120px;
            left: -120px;
            background: radial-gradient(circle, rgba(67, 97, 238, 0.28) 0%, rgba(67, 97, 238, 0) 70%);
            border-radius: 50%;
            filter: blur(50px);
            pointer-events: none;
            z-index: 0;
        }

        .ambient-glow-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            bottom: -150px;
            right: -120px;
            background: radial-gradient(circle, rgba(0, 188, 212, 0.22) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        .auth-card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
        }

        .auth-card {
            background: var(--login-card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--login-card-border);
            border-radius: 24px;
            box-shadow: 0 25px 60px -12px rgba(0, 0, 0, 0.4);
            padding: 40px 36px;
            transition: all 0.3s ease;
        }

        .brand-badge {
            width: 68px;
            height: 68px;
            border-radius: 20px;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 28px -6px rgba(67, 97, 238, 0.5);
            margin-bottom: 18px;
        }
        .brand-badge i {
            font-size: 2rem;
            color: #ffffff;
        }

        .input-box-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--login-input-bg);
            border: 1.5px solid var(--login-input-border);
            border-radius: 12px;
            transition: all 0.25s ease;
            overflow: hidden;
        }
        .input-box-wrapper:focus-within {
            border-color: #4361ee;
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.18);
        }
        .input-icon-box {
            padding: 0 14px;
            color: var(--login-muted);
            font-size: 1rem;
        }
        .custom-input {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 12px 14px 12px 0;
            color: var(--login-text);
            font-size: 0.95rem;
        }
        .custom-input::placeholder {
            color: var(--login-muted);
            opacity: 0.75;
        }

        .toggle-pw-btn {
            background: none;
            border: none;
            padding: 0 14px;
            color: var(--login-muted);
            cursor: pointer;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }
        .toggle-pw-btn:hover {
            color: var(--login-text);
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            display: flex;
            gap: 4px;
        }
        .strength-segment {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            transition: background-color 0.2s;
        }
        [data-theme="light"] .strength-segment {
            background-color: #e2e8f0;
        }

        .theme-toggle-corner {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
        }
        .theme-toggle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--login-card-bg);
            border: 1px solid var(--login-card-border);
            color: var(--login-text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .action-btn {
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            border: none;
            color: #ffffff;
            font-weight: 600;
            padding: 13px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px -4px rgba(67, 97, 238, 0.45);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -4px rgba(67, 97, 238, 0.6);
            color: #ffffff;
        }
    </style>
</head>
<body class="auth-body">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="theme-toggle-corner">
        <button class="theme-toggle-btn" id="themeBtn" onclick="toggleThemeAuth()" title="Toggle Theme">
            <i class="fa-solid fa-moon" id="themeIcon"></i>
        </button>
    </div>

    <div class="auth-card-container">
        <!-- Reset Form Card -->
        <div class="auth-card text-center d-none" id="formCard">
            <div class="brand-badge">
                <i class="fa-solid fa-lock-open"></i>
            </div>
            <h2 class="fw-bold mb-1" style="color:var(--login-text);">Reset Password</h2>
            <p class="small mb-4" style="color:var(--login-muted);">Enter the OTP sent to your email and set a new password</p>

            <form id="resetForm" class="text-start">
                <!-- Readonly Email -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color:var(--login-text);">Account Email</label>
                    <div class="input-box-wrapper" style="opacity:0.85;">
                        <div class="input-icon-box">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" class="custom-input" id="email" readonly required>
                    </div>
                </div>

                <!-- OTP Input -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color:var(--login-text);">6-Digit OTP Code</label>
                    <div class="input-box-wrapper">
                        <div class="input-icon-box">
                            <i class="fa-solid fa-shield"></i>
                        </div>
                        <input type="text" class="custom-input" id="otp" placeholder="123456" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autofocus>
                    </div>
                </div>

                <!-- New Password -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold" style="color:var(--login-text);">New Password</label>
                    <div class="input-box-wrapper">
                        <div class="input-icon-box">
                            <i class="fa-solid fa-key"></i>
                        </div>
                        <input type="password" class="custom-input" id="newPassword" placeholder="Min 8 characters" required minlength="8">
                        <button type="button" class="toggle-pw-btn toggle-pw" data-target="newPassword">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="strength-bar" id="strengthBar">
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                        <div class="strength-segment"></div>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label class="form-label small fw-semibold" style="color:var(--login-text);">Confirm Password</label>
                    <div class="input-box-wrapper">
                        <div class="input-icon-box">
                            <i class="fa-solid fa-check"></i>
                        </div>
                        <input type="password" class="custom-input" id="confirmPassword" placeholder="Re-enter password" required minlength="8">
                        <button type="button" class="toggle-pw-btn toggle-pw" data-target="confirmPassword">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="action-btn w-100 mb-3" id="submitBtn">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="submitSpinner" role="status"></span>
                    Save New Password
                </button>

                <div class="text-center mt-3">
                    <a href="index.html" class="text-decoration-none small" style="color:var(--login-muted);">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to sign in
                    </a>
                </div>
            </form>
        </div>

        <!-- Error Card (if no email provided) -->
        <div class="auth-card text-center d-none" id="errorCard">
            <div class="brand-badge" style="background: linear-gradient(135deg, #e63946 0%, #b5179e 100%);">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h2 class="fw-bold mb-2" style="color:var(--login-text);">Missing Request</h2>
            <p class="small mb-4" style="color:var(--login-muted);">No email address was provided for the password reset request.</p>
            <a href="forgot-password.html" class="action-btn d-block text-decoration-none w-100">Request Password Reset</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        function initThemeAuth() {
            const saved = localStorage.getItem(CONFIG.THEME_KEY) || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = saved === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        function toggleThemeAuth() {
            const cur = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem(CONFIG.THEME_KEY, next);
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = next === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }

        let email = null;

        document.addEventListener('DOMContentLoaded', () => {
            initThemeAuth();
            
            const urlParams = new URLSearchParams(window.location.search);
            email = urlParams.get('email');
            
            if (!email) {
                document.getElementById('errorCard').classList.remove('d-none');
            } else {
                document.getElementById('email').value = email;
                document.getElementById('formCard').classList.remove('d-none');
            }
        });

        // Toggle password visibility
        document.querySelectorAll('.toggle-pw').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.dataset.target;
                const input = document.getElementById(targetId);
                const icon = this.querySelector('i');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fa-solid fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fa-solid fa-eye';
                }
            });
        });

        // Password strength meter
        document.getElementById('newPassword').addEventListener('input', function() {
            const val = this.value;
            let score = 0;
            if (val.length > 7) score++;
            if (val.match(/[A-Z]/)) score++;
            if (val.match(/[0-9]/)) score++;
            if (val.match(/[^a-zA-Z0-9]/)) score++;
            
            const segments = document.querySelectorAll('.strength-segment');
            segments.forEach((seg, i) => {
                seg.style.backgroundColor = '';
                if (i < score) {
                    if (score === 1) seg.style.backgroundColor = '#e63946';
                    else if (score === 2) seg.style.backgroundColor = '#ff9f1c';
                    else if (score === 3) seg.style.backgroundColor = '#4cc9f0';
                    else seg.style.backgroundColor = '#2ec4b6';
                }
            });
        });

        // Form submit
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('submitSpinner');
            const otp = document.getElementById('otp').value.trim();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            btn.disabled = true;
            spinner.classList.remove('d-none');
            
            try {
                if (typeof resetPassword === 'function') {
                    await resetPassword(email, otp, newPassword, confirmPassword);
                }
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
