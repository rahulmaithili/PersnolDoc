<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DocVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4361ee, #1e2139);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .forgot-card, .success-card {
            width: 100%;
            max-width: 420px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #fff;
            padding: 2.5rem 2rem;
            margin: 1rem;
        }
    </style>
</head>
<body>
    <div class="forgot-card text-center" id="formCard">
        <div class="mb-4 text-primary">
            <i class="fa-solid fa-key fa-4x" style="color: #4361ee;"></i>
        </div>
        <h2 class="mb-1 fw-bold">Forgot Password</h2>
        <p class="text-muted mb-4">Enter your email and we'll send a reset link</p>
        <form id="forgotForm">
            <div class="input-group mb-4">
                <span class="input-group-text bg-light"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="Email Address" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-4 py-2" id="submitBtn" style="background-color: #4361ee; border-color: #4361ee; border-radius: 8px;">
                <span class="spinner-border spinner-border-sm d-none me-2" id="submitSpinner" role="status"></span>Send Reset Link
            </button>
            <a href="index.html" class="text-decoration-none text-muted small"><i class="fa-solid fa-arrow-left me-1"></i> Back to login</a>
        </form>
    </div>

    <div class="success-card text-center d-none" id="successCard">
        <div class="mb-4 text-success">
            <i class="fa-solid fa-check-circle fa-4x"></i>
        </div>
        <h2 class="mb-3 fw-bold">Reset link sent!</h2>
        <p class="text-muted mb-4">Please check your email inbox for the reset link.</p>
        <a href="index.html" class="btn btn-primary w-100 py-2" style="background-color: #4361ee; border-color: #4361ee; border-radius: 8px;">Back to login</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initTheme === 'function') initTheme();
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('submitSpinner');
            const email = document.getElementById('email').value.trim();
            
            btn.disabled = true;
            spinner.classList.remove('d-none');
            
            try {
                if (typeof forgotPassword === 'function') {
                    const success = await forgotPassword(email);
                    if (success) {
                        setTimeout(() => {
                            window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
                        }, 1800);
                    }
                }
            } finally {
                btn.disabled = false;
                spinner.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
